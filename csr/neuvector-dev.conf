# ==============================================================================
# CSR config — dcs-neuvector, DEV (standalone) cluster
#
#   openssl req -new -newkey rsa:4096 -nodes \
#     -keyout neuvector-dev.key -out neuvector-dev.csr -config neuvector-dev.conf
#
# ONE certificate per cluster covers every endpoint a non-NeuVector client can
# reach. All Routes are passthrough, so the pod itself serves this cert and each
# SAN must match its Route host exactly (org policy forbids wildcards).
#
# SANs are listed for hostnames whose Route is NOT enabled today as well. That is
# deliberate: adding a SAN now costs nothing, whereas turning an endpoint on
# later would mean re-issuing and re-sealing certs in every deployed environment.
#
# What each SAN is for:
#   .1  manager   — the NeuVector Web UI (browser-facing)
#   .2  controller REST API :10443 — admin/CI automation; Route disabled today
#   (no federation or adapter endpoint on this cluster)
#
# NOT included, on purpose: nothing for federation *trust*. NeuVector skips
# transport-level certificate verification on federation traffic and runs its own
# mTLS from the certificates exchanged during the join, so the fed hostname is
# here only so a human can curl the endpoint, not because federation needs it.
#
# After signing, seal it (leaf + intermediates, in that order):
#   cat signed.crt intermediate.crt > tls.crt
#   ../dcs-neuvector/scripts/seal.sh externaltls tls.crt out/neuvector-dev.key
# ==============================================================================

[ req ]
default_bits        = 4096
default_md          = sha256
prompt              = no
distinguished_name  = dn
req_extensions      = v3_req
string_mask         = utf8only

[ dn ]
C                   = DE
ST                  = REPLACE_STATE
L                   = REPLACE_CITY
O                   = REPLACE_ORG_LEGAL_NAME
OU                  = REPLACE_ORG_UNIT
CN                  = neuvector.apps.ocp-dev.x.com

[ v3_req ]
basicConstraints    = CA:FALSE
keyUsage            = critical, digitalSignature, keyEncipherment
extendedKeyUsage    = serverAuth, clientAuth
subjectAltName      = @alt_names

[ alt_names ]
DNS.1               = neuvector.apps.ocp-dev.x.com
DNS.2               = neuvector-api.apps.ocp-dev.x.com
