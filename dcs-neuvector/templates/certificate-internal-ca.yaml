{{- if .Values.dcs.internalCa.enabled }}
{{/*
Internal component-mTLS CA, owned by THIS chart instead of the subchart.

Why not the upstream one: `core.internal.certmanager.enabled` creates a CA
Certificate with a hardcoded `duration: 17520h` (2 years) and no renewBefore, so
cert-manager renews it at 1/3 of the lifetime — roughly every 8 months. Every
renewal changes ca.crt, and anything that pinned that CA (Harbor's trusted
bundle, for instance) has to be updated and its pods restarted. That is a
recurring manual task with a silent failure mode.

Owning it here lets us set the lifetime, and pin the key:

  privateKey.rotationPolicy: Never   (cert-manager's default, explicit here)

With the key reused, a re-issued CA certificate carries the same subject and the
same public key, so a copy of the OLD certificate already sitting in someone
else's trust store still validates the chain. The trust bundle only has to be
refreshed before the old certificate's notAfter, not on every renewal.

Set core.internal.certmanager.enabled=false alongside this (the default in
values.yaml) or you get two Certificates fighting over one secret name.
*/}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.dcs.internalCa.selfSignedIssuerName }}
  namespace: {{ include "dcs-neuvector.namespace" . }}
  labels:
{{ include "dcs-neuvector.labels" . | indent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.dcs.internalCa.secretName }}
  namespace: {{ include "dcs-neuvector.namespace" . }}
  labels:
{{ include "dcs-neuvector.labels" . | indent 4 }}
spec:
  isCA: true
  secretName: {{ .Values.dcs.internalCa.secretName }}
  duration: {{ .Values.dcs.internalCa.duration }}
  renewBefore: {{ .Values.dcs.internalCa.renewBefore }}
  privateKey:
    algorithm: {{ .Values.dcs.internalCa.privateKey.algorithm }}
    size: {{ .Values.dcs.internalCa.privateKey.size }}
    rotationPolicy: {{ .Values.dcs.internalCa.privateKey.rotationPolicy }}
  subject:
    organizations:
      - {{ .Values.dcs.internalCa.organization | quote }}
  commonName: {{ .Values.dcs.internalCa.commonName }}
  dnsNames:
    - {{ .Values.dcs.internalCa.commonName }}
  usages:
    - digital signature
    - key encipherment
    - cert sign
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: {{ .Values.dcs.internalCa.selfSignedIssuerName }}
{{- end }}
