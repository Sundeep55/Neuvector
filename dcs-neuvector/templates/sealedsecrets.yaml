{{/*
SealedSecrets for every credential NeuVector needs.

The encryptedData blobs are cluster-specific: the sealed-secrets controller in
each cluster has its own key pair, so the same plaintext must be re-sealed per
cluster (scripts/seal.sh does this). Blobs therefore live in the per-cluster
app-of-apps values file, never in this chart.

Sealing is strict-scoped (kubeseal's default): a blob is bound to this exact
namespace + secret name. That matches how sealed secrets are created for the
other NaaS components.

A block with an empty encryptedData map renders nothing, which lets the chart
install cleanly before a given credential exists.
*/}}
{{- $ctx := . -}}
{{- $ns := include "dcs-neuvector.namespace" . -}}
{{- $all := merge (dict) (.Values.dcs.secrets | default dict) (.Values.dcs.extraSecrets | default dict) -}}
{{- range $key, $s := $all }}
{{- if and $s.enabled $s.encryptedData }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ required (printf "dcs secret %q needs a .name" $key) $s.name }}
  namespace: {{ $ns }}
  labels:
{{ include "dcs-neuvector.labels" $ctx | indent 4 }}
    dcs.io/secret: {{ $key }}
  {{- $ann := merge (dict) ($s.annotations | default dict) ($ctx.Values.dcs.commonAnnotations | default dict) }}
  {{- with $ann }}
  annotations:
{{ toYaml . | indent 4 }}
  {{- end }}
spec:
  encryptedData:
{{ toYaml $s.encryptedData | indent 4 }}
  template:
    metadata:
      name: {{ $s.name }}
      namespace: {{ $ns }}
      labels:
{{ include "dcs-neuvector.labels" $ctx | indent 8 }}
      {{- with $s.secretAnnotations }}
      annotations:
{{ toYaml . | indent 8 }}
      {{- end }}
    type: {{ default "Opaque" $s.type }}
{{- end }}
{{- end }}
