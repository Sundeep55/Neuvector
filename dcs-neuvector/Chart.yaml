apiVersion: v2
name: dcs-neuvector
description: NaaS platform wrapper chart for NeuVector (SUSE Security) runtime container security
type: application

# Chart version — bump on every change to this wrapper.
version: 0.1.0

# NeuVector application version shipped by core-2.11.0.
appVersion: "5.6.0"

keywords:
  - neuvector
  - runtime-security
  - naas

annotations:
  dcs.io/component: neuvector
  dcs.io/upstream-chart: "core-2.11.0"

dependencies:
  - name: core
    version: "2.11.0"
    # Airgap: the packaged tgz is vendored under charts/, so `helm dependency update`
    # is NOT required to render or package this chart.
    # Internet-connected build hosts may instead use:
    #   repository: https://neuvector.github.io/neuvector-helm/
    # Airgapped build hosts pull the mirrored OCI copy:
    repository: "oci://registry.x.com/helm-oci"
