# ==============================================================================
# QA MANAGED — federation REMOTE, joins qa-hub. Tenant-facing UI.
# Lives in the managed app-of-apps repo under clusters/qa-managed-01/.
# ==============================================================================

dcs:
  role: managed
  clusterName: qa-managed-01

  systemConfig:
    alwaysReload: true
    newServicePolicyMode: Discover
    autoScan: false
    # Turn on when tenant self-service lands, so namespace users can export the
    # network policy of their own groups.
    allowNsUserExportNetPolicy: false

  secrets:
    imagePull:
      encryptedData:
        .dockerconfigjson: REPLACE_WITH_KUBESEAL_OUTPUT
    externalTls:
      encryptedData:
        tls.crt: REPLACE_WITH_KUBESEAL_OUTPUT
        tls.key: REPLACE_WITH_KUBESEAL_OUTPUT
    bootstrap:
      encryptedData:
        bootstrapPassword: REPLACE_WITH_KUBESEAL_OUTPUT
    # Same JOIN_TOKEN as qa-hub, sealed with THIS cluster's kubeseal key.
    #   scripts/seal.sh fedinit-remote qa-managed-01 \
    #     neuvector-fed.apps.ocp-qa-hub.x.com 443 <JOIN_TOKEN_UUID> \
    #     neuvector-fed.apps.ocp-qa-mgd01.x.com 443
    init:
      enabled: true
      encryptedData:
        fedinitcfg.yaml: REPLACE_WITH_KUBESEAL_OUTPUT

core:
  openshift: true

  controller:
    # REST API, exposed on every cluster for onboarding automation and CI.
    # The host must be a SAN of dcs-neuvector-external-certs.
    apisvc:
      type: ClusterIP
      route:
        enabled: true
        termination: passthrough
        host: neuvector-api.apps.ocp-qa-mgd01.x.com
    replicas: 3
    disruptionbudget: 2
    pvc:
      enabled: true
      storageClass: ocs-storagecluster-cephfs
      capacity: 10Gi
    resources:
      requests:
        cpu: 300m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

    # ---- federation remote ----------------------------------------------------
    # The hub reaches this endpoint to push federated policy and pull status.
    federation:
      managedsvc:
        type: ClusterIP
        route:
          enabled: true
          termination: passthrough
          host: neuvector-fed.apps.ocp-qa-mgd01.x.com

  enforcer:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

  manager:
    route:
      enabled: true
      termination: passthrough
      host: neuvector.apps.ocp-qa-mgd01.x.com
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  cve:
    scanner:
      replicas: 2
    updater:
      schedule: "0 3 * * *"
