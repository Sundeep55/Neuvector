# ==============================================================================
# DEV — single cluster, no federation.
# Drop this into the dev app-of-apps values for the dcs-neuvector application.
# ==============================================================================

dcs:
  role: standalone
  clusterName: dev

  systemConfig:
    alwaysReload: true
    newServicePolicyMode: Discover
    autoScan: false

  secrets:
    imagePull:
      encryptedData:
        .dockerconfigjson: REPLACE_WITH_KUBESEAL_OUTPUT
    externalTls:
      encryptedData:
        tls.crt: REPLACE_WITH_KUBESEAL_OUTPUT
        tls.key: REPLACE_WITH_KUBESEAL_OUTPUT
    bootstrap:
      encryptedData:
        bootstrapPassword: REPLACE_WITH_KUBESEAL_OUTPUT
    # No federation in dev -> no fedinitcfg.yaml needed.
    init:
      enabled: false

core:
  openshift: true

  # ---- minimal footprint: one of everything -----------------------------------
  controller:
    replicas: 1
    disruptionbudget: 0
    pvc:
      enabled: true
      storageClass: ocs-storagecluster-cephfs
      capacity: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

  enforcer:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

  manager:
    route:
      enabled: true
      termination: passthrough
      host: neuvector.apps.ocp-dev.x.com
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 512Mi

  cve:
    scanner:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
    updater:
      schedule: "0 3 * * *"
